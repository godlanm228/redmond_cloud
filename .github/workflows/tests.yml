name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Run test suite
        run: python -m pytest tests/ -q
